# ============================================================================
# LinkFlow — Netlify (Next.js)
# ============================================================================
# O Netlify deteta o Next.js e usa o plugin @netlify/plugin-nextjs, que trata
# do SSR, API routes, rewrites/redirects e do caching do next build.
#
# Env vars: configurar no dashboard do Netlify
# (Site configuration → Environment variables). A lista completa está em
# .env.example. Resumo:
#   Públicas (inlined no build — NEXT_PUBLIC_*):
#     NEXT_PUBLIC_APPWRITE_ENDPOINT / PROJECT_ID / DATABASE_ID ·
#     NEXT_PUBLIC_APPWRITE_FILES_BUCKET_ID / AVATARS_BUCKET_ID / BANNERS_BUCKET_ID
#     NEXT_PUBLIC_SITE_URL=https://linkflow-pt.netlify.app
#   Secret (server-only, nunca expor):
#     APPWRITE_API_KEY · IP_HASH_SECRET · UPSTASH_REDIS_REST_URL ·
#     UPSTASH_REDIS_REST_TOKEN
#
# NOTA: o deploy para Cloudflare Workers foi removido (ver git history) —
# este ficheiro substitui wrangler.jsonc + .github/workflows/deploy.yml.
# ============================================================================

# O build do Netlify começa por `npm run verify` — typecheck, ESLint e os testes
# Vitest. `npm run verify` sai com código != 0 a qualquer erro de tipos, regra do
# ESLint ou teste vermelho, o que aborta o deploy antes de `next build` publicar
# uma versão quebrada.
# Os testes correm sem `.env.local` (não dependem de variáveis de ambiente — o
# Vitest resolve `server-only` por um shim e não lê esse ficheiro), por isso o
# resultado local e o do CI coincidem. Reproduzir localmente: `npm run verify`.
[build]
  command = "npm run verify && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"